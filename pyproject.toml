[project]
name = "blog-generator-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Charles Raja R", email = "rcr2003rcharlesraja@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
    "watchdog>=6.0.0",
]

[project.scripts]
blog-generator-agent = "blog_generator_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
